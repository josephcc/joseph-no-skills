<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMCP demo — colour and sentence</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="layout">
    <main>
      <header>
        <h1 id="sentence">…</h1>
        <p class="swatch"><span id="swatch"></span> <code id="color">…</code></p>
        <p class="status">
          <span id="api-badge" class="badge">modelContext: …</span>
          <span id="daemon-badge" class="badge">daemon: idle</span>
          <button id="connect-btn" type="button">Connect to local Claude</button>
        </p>
        <p id="hint" class="hint"></p>
      </header>

      <section id="output-section" class="output" data-empty="true" aria-label="Output box">
        <div class="output-head">
          <h2>Output <span id="output-title" class="output-title"></span></h2>
          <span id="output-meta" class="output-meta">empty</span>
          <button id="output-copy" type="button" disabled>Copy</button>
          <button id="output-clear" type="button" disabled>Clear</button>
        </div>
        <pre id="output" class="output-box" aria-live="polite"></pre>
      </section>

      <section class="columns">
        <div>
          <h2>Registered tools <small id="tool-count"></small></h2>
          <ul id="tools"></ul>
          <p>
            <button id="bonus-btn" type="button">Register bonus tool (shout)</button>
            <button id="unbonus-btn" type="button" disabled>Unregister bonus tool</button>
            <button id="randomize-btn" type="button">Randomize (from the page)</button>
          </p>
        </div>
        <div>
          <h2>Call log</h2>
          <ol id="log" reversed></ol>
        </div>
      </section>

    </main>
    <aside id="chat-mount" class="chat-sidebar" aria-label="Local Claude chat"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
