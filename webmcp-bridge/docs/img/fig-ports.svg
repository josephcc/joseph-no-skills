<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 z" fill="#8a9a9e"/></marker>
  <marker id="tail" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 L1 6 L11 11 z" fill="#8a9a9e"/></marker>
</defs>
<rect width="1200" height="480" fill="#ffffff"/>
<rect x="40" y="150" width="200" height="90" rx="12" fill="#fff4e3" stroke="#d9a441" stroke-width="2"/><text x="58" y="185.6" font-size="22" font-weight="700" fill="#1f2a2e">serve</text><text x="58" y="223.45" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">(no --port)</text>
<rect x="300" y="120" width="300" height="150" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="318" y="155.6" font-size="22" font-weight="700" fill="#1f2a2e">A daemon recorded here?</text><text x="318" y="193.45" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">daemon.json in this state dir:</text><text x="318" y="218.1" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">pid alive, and GET /id</text><text x="318" y="242.75" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">answers as that instance</text>
<rect x="660" y="40" width="500" height="80" rx="12" fill="#eef6f4" stroke="#79a9a0" stroke-width="2"/><text x="678" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">yes → exit 0</text><text x="678" y="113.44999999999999" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">already running on 127.0.0.1:&lt;port&gt; (pid …)</text>
<rect x="660" y="170" width="500" height="110" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="678" y="205.6" font-size="22" font-weight="700" fill="#1f2a2e">no → claim daemon.json, then walk the list</text><text x="678" y="243.45" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">8737 → 49237 → 52451 → 55913 → 61327</text><text x="678" y="268.09999999999997" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">first free: listen, record the port · all taken: exit 1</text>
<rect x="40" y="340" width="1120" height="120" rx="12" fill="#eceefb" stroke="#7c86d6" stroke-width="2"/><text x="58" y="375.6" font-size="22" font-weight="700" fill="#1f2a2e">Every client walks the same list</text><text x="58" y="413.45" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">pages: GET /id on each candidate, then a WebSocket only to the port that answered as the daemon</text><text x="58" y="438.09999999999997" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the plugin's hooks and the webmcp-mcp relay: daemon.json first, then the list</text>
<path d="M240 195 L300 195" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<path d="M600 165 L660 80" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" /><rect x="608.56" y="92.5" width="42.88" height="26" rx="6" fill="#ffffff" opacity="0.95"/><text x="630" y="110.5" font-size="16" text-anchor="middle" fill="#5b6b70">yes</text>
<path d="M600 225 L660 225" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" /><rect x="613.04" y="195" width="33.92" height="26" rx="6" fill="#ffffff" opacity="0.95"/><text x="630" y="213" font-size="16" text-anchor="middle" fill="#5b6b70">no</text>
<path d="M910 280 L910 340" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
</svg>
