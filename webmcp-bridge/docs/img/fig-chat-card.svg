<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 z" fill="#8a9a9e"/></marker>
  <marker id="tail" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 L1 6 L11 11 z" fill="#8a9a9e"/></marker>
</defs>
<rect width="1200" height="730" fill="#ffffff"/>
<rect x="25" y="30" width="265" height="60" rx="12" fill="#eef6f4" stroke="#79a9a0" stroke-width="2"/><text x="39" y="60.8" font-size="21" font-weight="700" fill="#1f2a2e">AgentChat (page)</text>
<rect x="320" y="30" width="265" height="60" rx="12" fill="#fff4e3" stroke="#d9a441" stroke-width="2"/><text x="334" y="60.8" font-size="21" font-weight="700" fill="#1f2a2e">Daemon /acp</text>
<rect x="615" y="30" width="265" height="60" rx="12" fill="#eceefb" stroke="#7c86d6" stroke-width="2"/><text x="629" y="60.8" font-size="21" font-weight="700" fill="#1f2a2e">claude-agent-acp</text>
<rect x="910" y="30" width="265" height="60" rx="12" fill="#eef6f4" stroke="#79a9a0" stroke-width="2"/><text x="924" y="60.8" font-size="21" font-weight="700" fill="#1f2a2e">Page tools</text>
<rect x="25" y="120" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="49" cy="147" r="15" fill="#105257"/><text x="49" y="153" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="75" y="153" font-size="15" fill="#1f2a2e">session/new (page workspace)</text>
<rect x="320" y="190" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="344" cy="217" r="15" fill="#105257"/><text x="344" y="223" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="370" y="223" font-size="15" fill="#1f2a2e">spawn the agent, forward</text>
<rect x="25" y="260" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="49" cy="287" r="15" fill="#105257"/><text x="49" y="293" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="75" y="293" font-size="15" fill="#1f2a2e">prompt + page://ui-state</text>
<rect x="615" y="330" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="639" cy="357" r="15" fill="#105257"/><text x="639" y="363" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="665" y="363" font-size="15" fill="#1f2a2e">tools/call propose_palette</text>
<rect x="910" y="400" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="934" cy="427" r="15" fill="#105257"/><text x="934" y="433" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><text x="960" y="433" font-size="15" fill="#1f2a2e">the tool runs in the page</text>
<rect x="615" y="470" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="639" cy="497" r="15" fill="#105257"/><text x="639" y="503" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">6</text><text x="665" y="503" font-size="15" fill="#1f2a2e">result, then the reply text</text>
<rect x="25" y="540" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="49" cy="567" r="15" fill="#105257"/><text x="49" y="573" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">7</text><text x="75" y="573" font-size="15" fill="#1f2a2e">the card, from the result</text>
<rect x="25" y="610" width="265" height="54" rx="12" fill="#ffffff" stroke="#c9d3d6" stroke-width="2"/><circle cx="49" cy="637" r="15" fill="#105257"/><text x="49" y="643" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">8</text><text x="75" y="643" font-size="15" fill="#1f2a2e">Use: applied; note() recorded</text>
