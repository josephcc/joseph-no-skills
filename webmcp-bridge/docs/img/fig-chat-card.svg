<path d="M585 357 L615 357" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<path d="M880 427 L910 427" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<path d="M880 497 L910 497" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<path d="M615 567 L290 567" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<text x="600" y="700" font-size="16" text-anchor="middle" fill="#5b6b70">The note rides with the next prompt, so Claude learns what the user picked.</text>
</svg>
