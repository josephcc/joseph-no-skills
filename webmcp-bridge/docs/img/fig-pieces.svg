<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 z" fill="#8a9a9e"/></marker>
  <marker id="tail" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 L1 6 L11 11 z" fill="#8a9a9e"/></marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="40" y="40" width="360" height="530" rx="12" fill="#eef6f4" stroke="#79a9a0" stroke-width="2"/><text x="58" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">Browser tab</text>
<rect x="64" y="100" width="300" height="170" rx="12" fill="#ffffff" stroke="#79a9a0" stroke-width="2"/><text x="82" y="135.6" font-size="22" font-weight="700" fill="#1f2a2e">Your page</text><text x="82" y="173.45" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">registers tools on</text><text x="82" y="198.1" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">document.modelContext</text><text x="82" y="222.75" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">and describes itself:</text><text x="82" y="247.4" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">instructions + what the user sees</text>
<rect x="64" y="330" width="300" height="205" rx="12" fill="#ffffff" stroke="#79a9a0" stroke-width="2"/><text x="82" y="365.6" font-size="22" font-weight="700" fill="#1f2a2e">webmcp-connector</text><text x="82" y="403.45" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">connect()</text><text x="82" y="428.09999999999997" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">mirrors the tools, answers</text><text x="82" y="452.74999999999994" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">context requests, runs calls</text><text x="82" y="477.3999999999999" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">&lt;AgentChat&gt; the chat panel</text><text x="82" y="502.0499999999999" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">&lt;FloatingWidgetPanel&gt; cards</text>
<rect x="470" y="40" width="300" height="530" rx="12" fill="#fff4e3" stroke="#d9a441" stroke-width="2"/><text x="488" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">webmcp-bridge</text><text x="488" y="113.44999999999999" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6b70">one process on 127.0.0.1,</text><text x="488" y="138.1" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6b70">first free of 5 candidate ports</text>
<rect x="506" y="150" width="240" height="76" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="518" y="178" font-size="20" font-weight="700" fill="#1f2a2e">/mcp</text><text x="518" y="214.65" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the page's tools, over MCP</text>
<rect x="506" y="330" width="240" height="76" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="518" y="358" font-size="20" font-weight="700" fill="#1f2a2e">/ws</text><text x="518" y="394.65" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">pages, WebSocket</text>
<rect x="506" y="440" width="240" height="76" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="518" y="468" font-size="20" font-weight="700" fill="#1f2a2e">/acp</text><text x="518" y="504.65" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the chat, ACP over WebSocket</text>
<path d="M626 330 L626 226" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/><rect x="523.92" y="270" width="204.16000000000003" height="24" rx="6" fill="#ffffff" opacity="0.95"/><text x="626" y="286" font-size="14" text-anchor="middle" fill="#5b6b70">the same tools, mirrored</text>
<text x="506" y="532" font-size="14" text-anchor="start" fill="#5b6b70">origin approval · page registry</text><text x="506" y="552.3" font-size="14" text-anchor="start" fill="#5b6b70">a workspace per page origin</text>
<rect x="820" y="40" width="340" height="530" rx="12" fill="#eceefb" stroke="#7c86d6" stroke-width="2"/><text x="838" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">Local Claude Code</text><text x="838" y="113.44999999999999" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6b70">your login, your skills, your plugins</text>
<rect x="856" y="120" width="280" height="125" rx="12" fill="#ffffff" stroke="#7c86d6" stroke-width="2"/><text x="874" y="154" font-size="20" font-weight="700" fill="#1f2a2e">Terminal session</text><text x="874" y="189.2" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the webmcp-bridge plugin:</text><text x="874" y="212.39999999999998" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">hooks inject instructions + state,</text><text x="874" y="235.59999999999997" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">a stdio relay carries MCP</text>
<rect x="856" y="350" width="280" height="190" rx="12" fill="#ffffff" stroke="#7c86d6" stroke-width="2"/><text x="874" y="384" font-size="20" font-weight="700" fill="#1f2a2e">The chat's agent</text><text x="874" y="419.2" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">claude-agent-acp</text><text x="874" y="442.4" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">around Claude Code, one per open</text><text x="874" y="465.59999999999997" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">thread, started by the daemon in</text><text x="874" y="488.79999999999995" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the page's workspace, with the</text><text x="874" y="511.99999999999994" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">page's instructions as its prompt</text>
<path d="M214 270 L214 330" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<circle cx="192" cy="300" r="13" fill="#105257"/><text x="192" y="305" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="226" y="305" font-size="14" text-anchor="start" fill="#5b6b70">register tools</text>
<path d="M364 368 L506 368" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="435" cy="348" r="13" fill="#105257"/><text x="435" y="353" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="435" y="392" font-size="14" text-anchor="middle" fill="#5b6b70">register and call</text>
<path d="M364 478 L506 478" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="435" cy="458" r="13" fill="#105257"/><text x="435" y="463" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="435" y="502" font-size="14" text-anchor="middle" fill="#5b6b70">chat</text>
<path d="M746 478 L856 478" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="801" cy="458" r="13" fill="#105257"/><text x="801" y="463" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="801" y="502" font-size="14" text-anchor="middle" fill="#5b6b70">stdio relay</text>
<path d="M990 350 L990 300 L800 300 L800 216 L746 216" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<circle cx="895" cy="280" r="13" fill="#105257"/><text x="895" y="285" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="895" y="324" font-size="14" text-anchor="middle" fill="#5b6b70">call a tool</text>
<path d="M746 160 L856 160" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="801" cy="140" r="13" fill="#105257"/><text x="801" y="145" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="801" y="184" font-size="14" text-anchor="middle" fill="#5b6b70">list + call</text>
<text x="40" y="615" font-size="16" text-anchor="start" fill="#5b6b70">How the embedded chat works: ① the page registers its tools on document.modelContext and the connector picks them up.</text><text x="40" y="638.2" font-size="16" text-anchor="start" fill="#5b6b70">② The connector registers them with the daemon over /ws, sends the page's state, and runs the calls that come back.</text><text x="40" y="661.4" font-size="16" text-anchor="start" fill="#5b6b70">③ The chat panel in the page speaks ACP to /acp. ④ For each thread the daemon starts a Claude Code agent in the page's</text><text x="40" y="684.6" font-size="16" text-anchor="start" fill="#5b6b70">workspace and relays the conversation; the page's instructions are its system prompt and every prompt carries the page's state.</text><text x="40" y="707.8" font-size="16" text-anchor="start" fill="#5b6b70">⑤ The agent reaches the page's tools through /mcp, which forwards each call to the page over /ws; a card renders in the panel</text><text x="40" y="731" font-size="16" text-anchor="start" fill="#5b6b70">from the call's result. ⑥ A terminal session reaches the same tools through the plugin's relay; its hooks inject the same</text><text x="40" y="754.2" font-size="16" text-anchor="start" fill="#5b6b70">instructions and state.</text>
</svg>
