<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 z" fill="#8a9a9e"/></marker>
  <marker id="tail" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 L1 6 L11 11 z" fill="#8a9a9e"/></marker>
</defs>
<rect width="1200" height="690" fill="#ffffff"/>
<rect x="40" y="40" width="360" height="490" rx="12" fill="#eef6f4" stroke="#79a9a0" stroke-width="2"/><text x="58" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">Browser tab</text>
<rect x="64" y="100" width="312" height="170" rx="12" fill="#ffffff" stroke="#79a9a0" stroke-width="2"/><text x="82" y="135.6" font-size="22" font-weight="700" fill="#1f2a2e">Your page</text><text x="82" y="173.45" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">registers tools on</text><text x="82" y="198.1" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">document.modelContext</text><text x="82" y="222.75" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">and describes itself:</text><text x="82" y="247.4" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">instructions + what the user sees</text>
<rect x="64" y="300" width="312" height="205" rx="12" fill="#ffffff" stroke="#79a9a0" stroke-width="2"/><text x="82" y="335.6" font-size="22" font-weight="700" fill="#1f2a2e">webmcp-connector</text><text x="82" y="373.45" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">connect()</text><text x="82" y="398.09999999999997" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">mirrors the tools, answers</text><text x="82" y="422.74999999999994" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">context requests, runs calls</text><text x="82" y="447.3999999999999" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">&lt;AgentChat&gt;  the chat panel</text><text x="82" y="472.0499999999999" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">&lt;FloatingWidgetPanel&gt;  cards</text>
<rect x="470" y="40" width="300" height="490" rx="12" fill="#fff4e3" stroke="#d9a441" stroke-width="2"/><text x="488" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">webmcp-daemon</text><text x="488" y="113.44999999999999" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6b70">one process on 127.0.0.1,</text><text x="488" y="138.1" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6b70">first free of 5 candidate ports</text>
<rect x="494" y="150" width="252" height="76" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="506" y="178" font-size="20" font-weight="700" fill="#1f2a2e">/mcp</text><text x="506" y="214.65" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the page's tools, over MCP</text>
<rect x="494" y="300" width="252" height="76" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="506" y="328" font-size="20" font-weight="700" fill="#1f2a2e">/ws</text><text x="506" y="364.65" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">pages, WebSocket</text>
<rect x="494" y="400" width="252" height="76" rx="12" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text x="506" y="428" font-size="20" font-weight="700" fill="#1f2a2e">/acp</text><text x="506" y="464.65" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the chat, ACP over WebSocket</text>
<path d="M620 300 L620 226" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/><rect x="517.92" y="255" width="204.16000000000003" height="24" rx="6" fill="#ffffff" opacity="0.95"/><text x="620" y="271" font-size="14" text-anchor="middle" fill="#5b6b70">the same tools, mirrored</text>
<text x="494" y="500" font-size="14" text-anchor="start" fill="#5b6b70">origin approval · page registry</text><text x="494" y="520.3" font-size="14" text-anchor="start" fill="#5b6b70">a workspace per page origin</text>
<rect x="820" y="40" width="340" height="490" rx="12" fill="#eceefb" stroke="#7c86d6" stroke-width="2"/><text x="838" y="75.6" font-size="22" font-weight="700" fill="#1f2a2e">Local Claude Code</text><text x="838" y="113.44999999999999" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6b70">your login, your skills, your plugins</text>
<rect x="844" y="120" width="292" height="125" rx="12" fill="#ffffff" stroke="#7c86d6" stroke-width="2"/><text x="862" y="154" font-size="20" font-weight="700" fill="#1f2a2e">Terminal session</text><text x="862" y="189.2" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the webmcp-daemon plugin:</text><text x="862" y="212.39999999999998" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">hooks inject instructions + state,</text><text x="862" y="235.59999999999997" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">a stdio relay carries MCP</text>
<rect x="844" y="320" width="292" height="190" rx="12" fill="#ffffff" stroke="#7c86d6" stroke-width="2"/><text x="862" y="354" font-size="20" font-weight="700" fill="#1f2a2e">The chat's agent</text><text x="862" y="389.2" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2a2e">claude-agent-acp</text><text x="862" y="412.4" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">around Claude Code, one per open</text><text x="862" y="435.59999999999997" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">thread, started by the daemon in</text><text x="862" y="458.79999999999995" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">the page's workspace, with the</text><text x="862" y="481.99999999999994" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a2e">page's instructions as its prompt</text>
<path d="M376 338 L494 338" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="435" cy="318" r="13" fill="#105257"/><text x="435" y="323" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<path d="M376 438 L494 438" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="435" cy="418" r="13" fill="#105257"/><text x="435" y="423" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<path d="M746 438 L844 438" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="795" cy="418" r="13" fill="#105257"/><text x="795" y="423" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<path d="M990 320 L990 290 L800 290 L800 206 L746 206" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" />
<circle cx="1010" cy="273" r="13" fill="#105257"/><text x="1010" y="278" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<path d="M746 170 L844 170" fill="none" stroke="#8a9a9e" stroke-width="2.5"  marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="795" cy="150" r="13" fill="#105257"/><text x="795" y="155" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="40" y="575" font-size="16" text-anchor="start" fill="#5b6b70">How the embedded chat works: ① the page's tools, state and tool results travel over /ws. ② The chat panel in the page speaks ACP to /acp.</text><text x="40" y="598.2" font-size="16" text-anchor="start" fill="#5b6b70">③ For each thread the daemon starts a Claude Code agent in the page's workspace and relays the conversation; the page's instructions</text><text x="40" y="621.4" font-size="16" text-anchor="start" fill="#5b6b70">are its system prompt and every prompt carries the page's state. ④ The agent reaches the page's tools through /mcp, which forwards each</text><text x="40" y="644.6" font-size="16" text-anchor="start" fill="#5b6b70">call to the page over /ws; a card renders in the panel from the call's result. ⑤ A terminal session reaches the same tools through the</text><text x="40" y="667.8" font-size="16" text-anchor="start" fill="#5b6b70">plugin's relay, and its hooks inject the same instructions and state.</text>
</svg>
